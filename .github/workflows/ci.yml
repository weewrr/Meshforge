name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (node)
        run: npm run typecheck:node

      - name: Typecheck (web)
        run: npm run typecheck:web

      # 渲染层单测：纯离线（esbuild 内存转译 + 桩模块），不依赖后端与网络。
      # test:toolbar 是纯 CSS 契约检查（解析 workflows.css / shell.css 的声明），同样离线。
      - name: Unit tests (renderer stores / workflow nodes / node UI / toolbar layout)
        run: |
          npm run test:web
          npm run test:nodes
          npm run test:ui
          npm run test:toolbar

      - name: Build (electron-vite)
        run: npm run build

      - name: Bundle size budget
        run: npm run sizes

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # 依赖清单唯一事实来源 = server/requirements*.txt，不在 workflow 里硬编码包名。
          # requirements.txt    运行时可依赖（fastapi/pydantic/pillow/psutil/pymeshlab…）
          # requirements-dev.txt 仅 CI/测试需要（httpx）
          pip install -r server/requirements.txt -r server/requirements-dev.txt
          # MCP stdio server 的可选依赖（smoke test 需要 mcp 包）
          pip install -r server/requirements-mcp.txt

      - name: Syntax check (py_compile)
        run: python -m compileall server -q

      - name: Unit tests (path boundaries / workflows / jobs / model downloads / node params / disabled extensions)
        working-directory: server
        run: |
          python tests/test_paths.py
          python tests/test_jobs.py
          python tests/test_workflows.py
          python tests/test_model_downloads.py
          python tests/test_multiview_params.py
          python tests/test_generator_node_params.py
          python tests/test_image_node_params.py
          python tests/test_disabled_extensions.py

      - name: OpenAPI contract snapshot check
        run: python scripts/export_openapi.py --check

      - name: MCP stdio smoke test
        run: python scripts/test_mcp_stdio.py

      - name: pip dependency sanity (pip check)
        run: python -m pip check

  integration:
    # 端到端冒烟（文档 5.1 integration job）：真实起 uvicorn 后端，
    # 走 HTTP 验证 health / 认证 / workflows CRUD 全链路。
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt
          pip install -r server/requirements-mcp.txt

      - name: Start backend and smoke test
        env:
          MESHFORGE_API_PORT: '8971'
        run: |
          set -euo pipefail
          port="$MESHFORGE_API_PORT"
          base="http://127.0.0.1:${port}"

          # 数据目录隔离：workspace / models / extensions / .api-token 全部落这里。
          #
          # 关键坑（这正是此前 curl: (7) + 健康检查永远不就绪的根因）：
          # `mktemp -d` 在 Git Bash 下产出 `/tmp/xxx` 这类 POSIX 路径，
          # 但 Windows 版 python 会把 `/tmp/xxx` 解析成 **当前盘符根** 的
          # `D:\tmp\xxx`，与 bash 眼中的 `%TEMP%\xxx` 完全不是同一个目录。
          # 于是后端把 .api-token / workspace 写到一处，shell 去另一处读，
          # 无论等多久都拿不到 token。
          # 解法：让目标平台上的 python 自己解析出真实绝对路径，
          # 再回填给 shell——两个平台语义都正确。
          if [ -n "${RUNNER_TEMP:-}" ]; then
            data_dir="$RUNNER_TEMP/meshforge-smoke"
            rm -rf "$data_dir" && mkdir -p "$data_dir"
          else
            # 本地为 Git Bash：先让 python 把 tempfile 目录解析成绝对路径。
            data_dir="$(python -c 'import tempfile; print(tempfile.mkdtemp(prefix="meshforge-smoke-"))')"
          fi
          export MESHFORGE_DATA_DIR="$data_dir"
          log="$MESHFORGE_DATA_DIR/uvicorn.log"
          probe_json="$MESHFORGE_DATA_DIR/probe.json"

          # 导入门禁：main.py 用顶层绝对导入（from config import ...），
          # server/ 下没有 __init__.py，因此**只能**在 server/ 目录内以
          # `main` 为顶层模块导入。这里先单独 import 一次，让依赖缺失或
          # 导入错误立刻在工作流日志里带 traceback 暴露，而不是干等健康探针超时。
          (
            cd server
            python -c "import main; print('import ok:', main.app)"
          )

          # uvicorn 用 `python -m uvicorn` 而非裸 `uvicorn`：前者只依赖
          # 解释器自身的 sys.path，不要求 PATH 里有 entry-point 脚本，
          # 在各种 runner 镜像上都稳定。
          (
            cd server
            python -m uvicorn main:app --host 127.0.0.1 --port "$port" >"$log" 2>&1
          ) &
          pid=$!
          echo "$pid" > /tmp/meshforge.pid

          # 无论成败都回收子进程，并在失败时强制打印后端日志。
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Uvicorn log"
              cat "$log" || true
              echo "::endgroup::"
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          # 等健康探针就绪（最多 30s）。进程中途死掉立即失败。
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "backend exited before becoming ready"
              exit 1
            fi
            if curl -s -f -o "$probe_json" "$base/health" 2>/dev/null &&
               grep -q '"ok"' "$probe_json"; then break; fi
            sleep 1
          done
          curl -fsS "$base/health" | grep -q '"ok"'
          echo "health: ok"

          # 取 HTTP 状态码：显式 --output 到真实文件，不用 -o /dev/null。
          # Git for Windows 自带的 curl 对 /dev/null 会写失败并返回 23，
          # 此时 -w 仍打印出正确状态码，退出码却污染了严格模式。
          probe_status() {
            curl -sS --output "$probe_json" --write-out '%{http_code}' "$@" || true
          }

          # 认证：无 token 401，带 token 200（token 由后端写入数据目录）。
          code=$(probe_status "$base/workflows")
          [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; exit 1; }
          TOKEN=$(cat "$MESHFORGE_DATA_DIR/.api-token")
          code=$(probe_status -H "Authorization: Bearer $TOKEN" "$base/workflows")
          [ "$code" = "200" ] || { echo "expected 200 with token, got $code"; exit 1; }
          echo "auth: 401 without token / 200 with token"

          # workflows CRUD 往返。
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"id":"smoke","name":"Smoke","nodes":[],"edges":[]}' \
            "$base/workflows" | grep -q '"ok"'
          curl -fsS -H "Authorization: Bearer $TOKEN" "$base/workflows/smoke" | grep -q '"Smoke"'
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$base/workflows/smoke" | grep -q '"ok"'
          echo "workflows CRUD: ok"

          # 就绪探针。
          curl -fsS "$base/health/ready" | grep -q '"ready"'
          echo "readiness probe: ok"

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/meshforge.pid ]; then kill "$(cat /tmp/meshforge.pid)" || true; fi

  quality:
    # 依赖质量门禁（文档 5.1 quality job）：audit 高危告警；不阻塞合并但必须在日志可见。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: npm audit (runtime deps, critical only)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt
          pip install -r server/requirements-mcp.txt

      - name: pip check
        run: python -m pip check

      - name: Generate SBOM (CycloneDX)
        # 供应链治理（优化文档 13.6 / §22）：syft 扫描仓库依赖树，
        # 产出 CycloneDX JSON 并作为 artifact 上传，供归档与漏洞比对。
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: meshforge-sbom.json

  package:
    # 打包冒烟（文档 5.1 package job）：验证 extraResources 落点与产物结构。
    # Windows runner 上执行，因为发布目标是 win-unpacked。
    runs-on: windows-latest
    needs: [frontend, python, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Python runtime (embeddable + deps incl. modelscope)
        # 随包分发的自包含运行时：让安装包在未装 Python 的机器上也能运行后端
        # 与模型下载。会下载解释器并安装后端依赖，耗时数分钟。
        run: python scripts/prepare_bundled_python.py

      - name: Build + pack (electron-builder --dir)
        run: npm run pack

      - name: Verify packaged server resources
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/win-unpacked/resources/server/main.py')) {
            throw 'resources/server/main.py missing from package'
          }
          if (-not (Test-Path 'dist/win-unpacked/resources/server/.runtime/python/python.exe')) {
            throw 'bundled Python runtime missing from package'
          }
          if (-not (Test-Path 'dist/win-unpacked/resources/server/.runtime/python/Scripts/modelscope.exe')) {
            throw 'modelscope CLI missing from bundled runtime'
          }
          if (Test-Path 'dist/win-unpacked/resources/app.asar') {
            Write-Host 'app.asar present (expected); server must live in resources/server'
          }
