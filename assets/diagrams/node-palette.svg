<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 776" width="1600" height="776"
     role="img" aria-label="MeshForge node types">
  <title>MeshForge node types</title>
  <desc>Thirty-seven built-in node types in seven groups: I/O, flow control, compute, variables, event dispatchers, subgraph/extension and comment.</desc>
  <style>
    .t1   { fill: #0d1526; }
    .t2   { fill: #4a5768; }
    .t3   { fill: #8b93a7; }
    .card { fill: #f6f8fb; stroke: rgba(15,23,42,0.10); }
    .box  { fill: #ffffff; stroke: rgba(15,23,42,0.13); }
    .soft { fill: #eef2f8; }
    .ln   { stroke: #9aa3b5; fill: #9aa3b5; }
    .lnd  { stroke: #c2cad6; fill: #c2cad6; }
    .ga   { stop-color: #2f6ee0; }
    .gb   { stop-color: #7c3aed; }

    @media (prefers-color-scheme: dark) {
      .t1   { fill: #e6e8ee; }
      .t2   { fill: #a9b1c3; }
      .t3   { fill: #6b7386; }
      .card { fill: #141922; stroke: rgba(255,255,255,0.09); }
      .box  { fill: #1a1d25; stroke: rgba(255,255,255,0.12); }
      .soft { fill: #1f2531; }
      .ln   { stroke: #4a5164; fill: #4a5164; }
      .lnd  { stroke: #333a48; fill: #333a48; }
      .ga   { stop-color: #4f8cff; }
      .gb   { stop-color: #a855f7; }
    }

    .sans { font-family: 'Segoe UI','Helvetica Neue',Inter,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,Menlo,monospace; }
    .a    { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop class="ga" offset="0"/>
      <stop class="gb" offset="1"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" class="ln" fill="currentColor"/>
    </marker>
  </defs>

  <text x="30" y="42" class="sans t1" font-size="25" font-weight="600">Thirty-seven node types, seven groups</text>
  <text x="30" y="70" class="sans t3" font-size="15.5">Every node declares typed ports — the canvas only accepts edges whose port types match.</text>
  <rect x="30" y="92" width="740" height="146" rx="14" class="card"/>
  <rect x="30" y="92" width="5" height="146" rx="2.5" fill="#38bdf8"/>
  <text x="62" y="126" class="sans t1" font-size="19" font-weight="600">I/O</text>
  <text x="62" y="149" class="sans t3" font-size="13.5">Source media in, results out</text>
  <rect x="718" y="112" width="32" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="734" y="127" text-anchor="middle" class="mono" font-size="12.5" fill="#38bdf8">7</text>
  <rect x="54" y="168" width="62" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="85" y="188" text-anchor="middle" class="mono t1" font-size="13">Image</text>
  <rect x="124" y="168" width="54.4" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="151.2" y="188" text-anchor="middle" class="mono t1" font-size="13">Text</text>
  <rect x="186.4" y="168" width="115.2" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="244" y="188" text-anchor="middle" class="mono t1" font-size="13">Load 3D Mesh</text>
  <rect x="309.6" y="168" width="62" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="340.6" y="188" text-anchor="middle" class="mono t1" font-size="13">Array</text>
  <rect x="379.6" y="168" width="122.8" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="441" y="188" text-anchor="middle" class="mono t1" font-size="13">Generate Mesh</text>
  <rect x="510.4" y="168" width="77.2" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="549" y="188" text-anchor="middle" class="mono t1" font-size="13">Preview</text>
  <rect x="595.6" y="168" width="115.2" height="30" rx="15" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-opacity="0.34"/>
  <text x="653.2" y="188" text-anchor="middle" class="mono t1" font-size="13">Add to Scene</text>
  <rect x="30" y="260" width="740" height="184" rx="14" class="card"/>
  <rect x="30" y="260" width="5" height="184" rx="2.5" fill="#60a5fa"/>
  <text x="62" y="294" class="sans t1" font-size="19" font-weight="600">Compute</text>
  <text x="62" y="317" class="sans t3" font-size="13.5">Blueprints-style pure data nodes</text>
  <rect x="718" y="280" width="32" height="22" rx="11" fill="#60a5fa" fill-opacity="0.15"/>
  <text x="734" y="295" text-anchor="middle" class="mono" font-size="12.5" fill="#60a5fa">10</text>
  <rect x="54" y="336" width="84.8" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="96.4" y="356" text-anchor="middle" class="mono t1" font-size="13">Is Valid</text>
  <rect x="146.8" y="336" width="84.8" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="189.2" y="356" text-anchor="middle" class="mono t1" font-size="13">Is Empty</text>
  <rect x="239.6" y="336" width="54.4" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="266.8" y="356" text-anchor="middle" class="mono t1" font-size="13">Bool</text>
  <rect x="302" y="336" width="54.4" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="329.2" y="356" text-anchor="middle" class="mono t1" font-size="13">Math</text>
  <rect x="364.4" y="336" width="77.2" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="403" y="356" text-anchor="middle" class="mono t1" font-size="13">Compare</text>
  <rect x="449.6" y="336" width="107.6" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
