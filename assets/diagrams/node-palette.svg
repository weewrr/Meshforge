  <text x="1247" y="356" text-anchor="middle" class="mono t1" font-size="13">Make Struct</text>
  <rect x="1308.8" y="336" width="115.2" height="30" rx="15" fill="#fbbf24" fill-opacity="0.11" stroke="#fbbf24" stroke-opacity="0.34"/>
