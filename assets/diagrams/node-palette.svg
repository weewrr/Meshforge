  <text x="1199.2" y="188" text-anchor="middle" class="mono t1" font-size="13">Sequence</text>
  <rect x="1249.6" y="168" width="69.6" height="30" rx="15" fill="#facc15" fill-opacity="0.11" stroke="#facc15" stroke-opacity="0.34"/>
  <text x="1284.4" y="188" text-anchor="middle" class="mono t1" font-size="13">Select</text>
  <rect x="1327.2" y="168" width="54.4" height="30" rx="15" fill="#facc15" fill-opacity="0.11" stroke="#facc15" stroke-opacity="0.34"/>
  <text x="1354.4" y="188" text-anchor="middle" class="mono t1" font-size="13">Gate</text>
  <rect x="1389.6" y="168" width="77.2" height="30" rx="15" fill="#facc15" fill-opacity="0.11" stroke="#facc15" stroke-opacity="0.34"/>
