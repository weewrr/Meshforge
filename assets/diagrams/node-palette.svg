  <rect x="565.2" y="336" width="54.4" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="592.4" y="356" text-anchor="middle" class="mono t1" font-size="13">Cast</text>
  <rect x="627.6" y="336" width="62" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="658.6" y="356" text-anchor="middle" class="mono t1" font-size="13">Clamp</text>
  <rect x="54" y="374" width="54.4" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="81.2" y="394" text-anchor="middle" class="mono t1" font-size="13">Lerp</text>
  <rect x="116.4" y="374" width="69.6" height="30" rx="15" fill="#60a5fa" fill-opacity="0.11" stroke="#60a5fa" stroke-opacity="0.34"/>
  <text x="151.2" y="394" text-anchor="middle" class="mono t1" font-size="13">Random</text>
