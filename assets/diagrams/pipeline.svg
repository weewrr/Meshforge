<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 300" width="1610" height="300"
     role="img" aria-label="MeshForge generation pipeline">
  <title>MeshForge generation pipeline</title>
  <desc>Image and Text inputs feed the generator, the result is previewed in the 3D viewport and exported as OBJ, STL, PLY or GLB.</desc>
  <style>
    .t1   { fill: #0d1526; }
    .t2   { fill: #4a5768; }
    .t3   { fill: #8b93a7; }
    .card { fill: #f6f8fb; stroke: rgba(15,23,42,0.10); }
    .box  { fill: #ffffff; stroke: rgba(15,23,42,0.13); }
    .soft { fill: #eef2f8; }
    .ln   { stroke: #9aa3b5; fill: #9aa3b5; }
    .lnd  { stroke: #c2cad6; fill: #c2cad6; }
    .ga   { stop-color: #2f6ee0; }
    .gb   { stop-color: #7c3aed; }

    @media (prefers-color-scheme: dark) {
      .t1   { fill: #e6e8ee; }
      .t2   { fill: #a9b1c3; }
      .t3   { fill: #6b7386; }
      .card { fill: #141922; stroke: rgba(255,255,255,0.09); }
      .box  { fill: #1a1d25; stroke: rgba(255,255,255,0.12); }
      .soft { fill: #1f2531; }
      .ln   { stroke: #4a5164; fill: #4a5164; }
      .lnd  { stroke: #333a48; fill: #333a48; }
      .ga   { stop-color: #4f8cff; }
      .gb   { stop-color: #a855f7; }
    }

    .sans { font-family: 'Segoe UI','Helvetica Neue',Inter,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,Menlo,monospace; }
    .a    { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop class="ga" offset="0"/>
      <stop class="gb" offset="1"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" class="ln" fill="currentColor"/>
    </marker>
  </defs>

  <text x="46" y="42" class="sans t2" font-size="17" font-weight="600">One run, end to end</text>
  <rect x="46" y="70" width="262" height="148" rx="14" class="card"/>
  <rect x="46" y="70" width="262" height="4" rx="2" fill="#38bdf8"/>
<g transform="translate(72 110) scale(0.72)"><rect x="4" y="7" width="24" height="18" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.4"/><circle cx="12" cy="14" r="3" fill="#38bdf8"/><path d="M7 22l7-7 5 5 4-3 5 5" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="122" y="128" class="sans t1" font-size="20" font-weight="600">Image</text>
  <text x="122" y="152" class="sans t3" font-size="14.5">drop in a photo</text>
  <text x="68" y="192" class="mono t3" font-size="13">step 1</text>
  <path d="M318 144h32" class="ln a" marker-end="url(#arw)"/>
  <rect x="360" y="70" width="262" height="148" rx="14" class="card"/>
  <rect x="360" y="70" width="262" height="4" rx="2" fill="#fbbf24"/>
<g transform="translate(386 110) scale(0.72)"><path d="M6 8h20M16 8v20" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/><path d="M10 24h12" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="436" y="128" class="sans t1" font-size="20" font-weight="600">Text</text>
  <text x="436" y="152" class="sans t3" font-size="14.5">optional prompt</text>
  <text x="382" y="192" class="mono t3" font-size="13">step 2</text>
  <path d="M632 144h32" class="ln a" marker-end="url(#arw)"/>
  <rect x="674" y="70" width="262" height="148" rx="14" class="card"/>
  <rect x="674" y="70" width="262" height="4" rx="2" fill="#34d399"/>
<g transform="translate(700 110) scale(0.72)"><circle cx="16" cy="16" r="4.6" fill="none" stroke="#34d399" stroke-width="2.4"/><path d="M16 3.5v4M16 24.5v4M3.5 16h4M24.5 16h4M7.2 7.2l2.9 2.9M21.9 21.9l2.9 2.9M24.8 7.2l-2.9 2.9M10.1 21.9l-2.9 2.9" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="750" y="128" class="sans t1" font-size="20" font-weight="600">Generate Mesh</text>
  <text x="750" y="152" class="sans t3" font-size="14.5">local inference</text>
  <text x="696" y="192" class="mono t3" font-size="13">step 3</text>
  <path d="M946 144h32" class="ln a" marker-end="url(#arw)"/>
  <rect x="988" y="70" width="262" height="148" rx="14" class="card"/>
  <rect x="988" y="70" width="262" height="4" rx="2" fill="#38bdf8"/>
<g transform="translate(1014 110) scale(0.72)"><path d="M16 4l11 6.5v11L16 28 5 21.5v-11z" fill="none" stroke="#38bdf8" stroke-width="2.3"/><path d="M5 10.5L16 17l11-6.5M16 17v11" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="1064" y="128" class="sans t1" font-size="20" font-weight="600">Preview</text>
  <text x="1064" y="152" class="sans t3" font-size="14.5">inspect &amp; tweak</text>
  <text x="1010" y="192" class="mono t3" font-size="13">step 4</text>
  <path d="M1260 144h32" class="ln a" marker-end="url(#arw)"/>
  <rect x="1302" y="70" width="262" height="148" rx="14" class="card"/>
  <rect x="1302" y="70" width="262" height="4" rx="2" fill="#a78bfa"/>
<g transform="translate(1328 110) scale(0.72)"><path d="M16 5v16" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/><path d="M10 15l6 6 6-6" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 27h20" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/></g>
  <text x="1378" y="128" class="sans t1" font-size="20" font-weight="600">Export</text>
  <text x="1378" y="152" class="sans t3" font-size="14.5">OBJ · STL · PLY · GLB</text>
  <text x="1324" y="192" class="mono t3" font-size="13">step 5</text>
</svg>
