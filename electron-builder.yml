appId: dev.weewrr.meshforge
productName: MeshForge

directories:
  # 打包产物输出到 dist/（已 gitignore）
  output: dist
  buildResources: build

# 应用本体：electron-vite 构建产物（主进程依赖已被 bundle，无需 node_modules）
files:
  - out/**
  - package.json
  - "!out/**/*.map"

# Python 后端源码随包携带（供 python-bridge 在用户机器上拉起）
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!**/__pycache__/**"
      - "!.venv/**"
      - "!workspace/**"
      - "!models/**"
  - from: scripts
    to: scripts
    filter:
      # 随包携带全部模型服务的 setup/start 脚本（文档 3.1 第 5 条：
      # 此前只打包了 Hunyuan 的两个脚本，其余模型服务启动资源缺失）。
      - "*.bat"

win:
  target:
    - target: nsis
      arch: [x64]
  # 无正式签名证书前跳过签名
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

# 暂未提供 build/icon.ico 时自动使用 Electron 默认图标；放入后自动启用
